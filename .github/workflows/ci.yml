name: CI — Lint, Lighthouse & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================================
  # JOB 1 — Lint (HTML, CSS, JS)
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install lint tools
        run: |
          npm install -g \
            html-validate \
            stylelint \
            stylelint-config-standard \
            eslint \
            @eslint/js

      - name: Lint HTML
        run: html-validate index.html

      - name: Lint CSS
        run: |
          echo '{"extends":["stylelint-config-standard"],"rules":{"color-no-invalid-hex":true,"declaration-block-no-duplicate-properties":true}}' > .stylelintrc.json
          stylelint "styles/**/*.css"

      - name: Lint JavaScript
        run: |
          echo '{"env":{"browser":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-undef":"warn"}}' > .eslintrc.json
          eslint "scripts/**/*.js" || true

  # ============================================================
  # JOB 2 — Lighthouse CI
  # ============================================================
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli serve

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.staticDistDir=. \
            --collect.numberOfRuns=1 \
            --assert.assertions.categories:performance=["warn",{"minScore":0.9}] \
            --assert.assertions.categories:accessibility=["error",{"minScore":0.9}] \
            --assert.assertions.categories:seo=["warn",{"minScore":0.9}] \
            --assert.assertions.categories:best-practices=["warn",{"minScore":0.85}] \
            --upload.target=temporary-public-storage \
          || echo "::warning::Lighthouse targets not fully met — check report above"

  # ============================================================
  # JOB 3 — Deploy to GitHub Pages (main branch only)
  # ============================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
